# HTTPS 证书签发前，先仅保留下方 80 端口 server；证书就绪后再启用 443 配置。
server {
  listen 80;
  server_name paopaoai.pixiepoppy.com test.paopaoai.pixiepoppy.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name paopaoai.pixiepoppy.com;

  ssl_certificate /etc/letsencrypt/live/paopaoai.pixiepoppy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/paopaoai.pixiepoppy.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://paopao-prod-app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name test.paopaoai.pixiepoppy.com;

  ssl_certificate /etc/letsencrypt/live/paopaoai.pixiepoppy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/paopaoai.pixiepoppy.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://paopao-test-app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
