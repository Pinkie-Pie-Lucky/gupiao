server {
    server_name paopaoai.pixiepoppy.com;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/paopaoai.pixiepoppy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/paopaoai.pixiepoppy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = paopaoai.pixiepoppy.com) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name paopaoai.pixiepoppy.com;
    return 404;
}
