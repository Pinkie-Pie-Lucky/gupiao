services:
  nginx:
    image: nginx:1.27-alpine
    container_name: paopao-edge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/paopao.active.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书由 Certbot 写入此目录；首次签发前可先以 HTTP 配置启动。
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      paopao-edge:

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  paopao-edge:
    name: paopao-edge
